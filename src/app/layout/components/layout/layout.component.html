<div class="app-layout">
    <header class="sidebar-header">
        <div class="sidebar-header">
            <img src="assets/icons/logo.svg" alt="Центр управления" class="logo" />
            <span class="app-title">Центр управления</span>
        </div>
        <nav class="main-nav">
            <ul class="top-tabs">
                <li class="tab-item" routerLink="/info" routerLinkActive="active">Информация</li>
                <li class="tab-item" routerLink="/files" routerLinkActive="active">Файлы</li>
            </ul>
        </nav>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <app-tree-view (selectedObject)="onObjectSelected($event)" />
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <router-outlet></router-outlet>
        <app-toast-component />
    </main>
</div>
